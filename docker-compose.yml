# One-command local environment: PHP 8.3 + Apache and MySQL 8.
#
#   docker compose up --build
#   → http://localhost:8080   (login: admin / admin123 — change ADMIN_PASSWORD_HASH below)
#
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: worldcup_db
      DB_USER: worldcup
      DB_PASSWORD: worldcup
      ADMIN_USERNAME: admin
      # php -r "echo password_hash('your-password', PASSWORD_DEFAULT);"
      ADMIN_PASSWORD_HASH: "$$2y$$10$$099ot0Oiyy4VqP4007lIMO4164tsfbM9nz5pJIxmB58VkLLjCZO7G"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: worldcup_db
      MYSQL_USER: worldcup
      MYSQL_PASSWORD: worldcup
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
